# ============================================================
# 应用喂狗（硬件看门狗）配置
#
# 生效优先级：命令行 > 环境变量 > 本文件 > 内置默认值
# 本文件与可执行文件放在同一目录即可被自动读取
# （查找顺序：$WATCHDOG_CONF -> ./watchdog.conf -> ./data/watchdog.conf -> ./config/watchdog.conf）
#
# 键名与环境变量一致，可省略 WATCHDOG_ 前缀。
# 格式：KEY=VALUE，'#' 之后为注释。
#
# 换平台 / 换芯片时通常只需改 DEV / TIMEOUT_S，无需重新编译。
# ============================================================

# 总开关：0=关（默认），1=开。也可写 on/off/true/false/yes/no
WATCHDOG_ENABLE=0

# 设备节点：不同芯片可能为 /dev/watchdog、/dev/watchdog0、/dev/watchdog1 ...
# 写 none 表示不使用硬件狗，只保留"主线程卡死 -> 执行动作"的软件监护
WATCHDOG_DEV=/dev/watchdog0

# 硬件超时（秒）。<=0 表示沿用驱动默认值。
# 注意：驱动会把它向上量化到硬件支持的最接近档位，
#       启动日志中打印的是实际生效值，估算复位延迟请用它。
WATCHDOG_TIMEOUT_S=30

# 喂狗周期（ms）。0 = 自动取 min(卡死阈值/5, 超时/3)，且不小于 100
WATCHDOG_FEED_MS=0

# 主线程存活上报间隔（ms）：checkEvents 每轮只做时间比较，
# 达到该间隔才在 handleEvents 里刷新一次存活信号。
# 0 = 每轮都上报；实际值会被限制到不超过卡死阈值的 1/4
WATCHDOG_TICK_MS=100

# 主线程连续不可用阈值（ms）。达到阈值即停止喂狗。
# <=0 表示关闭卡死判定（只防喂狗线程/进程整体死掉）
WATCHDOG_STALL_MS=10000

# 启动宽限期（ms）：应用初始化阶段不判定卡死，只正常喂狗。<=0 关闭
WATCHDOG_GRACE_MS=30000

# 卡死策略：
#   latch = 判定后永久停喂，主线程恢复也不取消（保证复位，适合无人值守）
#   pause = 判定后暂停喂狗，主线程恢复则继续喂（取消本次复位）
WATCHDOG_POLICY=pause

# 判定卡死后执行的动作：none / reboot / exec:<命令>
#   none   = 只打日志，依赖硬件超时复位（默认）
#   reboot = 立即调用 reboot()（需要 root/CAP_SYS_BOOT）
#   exec:  = 执行自定义命令，例如 exec:/data/app/board/restart.sh
WATCHDOG_ACTION=none

# 收到 SIGTERM/SIGINT/SIGHUP 时写 'V' magic close，避免正常停机变成复位
WATCHDOG_DISARM_ON_SIGNAL=1
